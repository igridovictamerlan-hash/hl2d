# Сайт игры на GitHub Pages: сборка при каждом пуше в main (и вручную во вкладке Actions).
# Один раз включить: Settings → Pages → Source: «GitHub Actions». Адрес — https://<владелец>.github.io/<репозиторий>/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Относительный base: игра работает из подпапки /<репозиторий>/ (карты ?map= — через BASE_URL).
      - run: npx vite build --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
