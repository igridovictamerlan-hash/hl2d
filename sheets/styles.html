<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стили пешек</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=PT+Mono&family=PT+Sans+Narrow&display=swap">
  <style>
    body { margin: 0; background: #23211e; color: #e8e2d4; font: 15px "PT Sans Narrow", sans-serif; }
    section { padding: 16px 20px 24px; border-bottom: 2px solid #3a3631; }
    h2 { font: 600 26px Oswald, sans-serif; margin: 0 0 4px; letter-spacing: .5px; }
    h2 b { color: #d4b07a; margin-right: 10px; }
    p.note { margin: 0 0 12px; max-width: 980px; color: #bdb6a6; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .card { background: #2e2b27; padding: 6px; }
    .card div { font: 13px "PT Mono", monospace; color: #cfc6b4; padding-top: 4px; }
    canvas { display: block; image-rendering: pixelated; }
    .strip { margin-top: 12px; }
  </style>
</head>
<body>
  <!-- Варианты стиля пешек рядом: npm run dev → http://localhost:5173/sheets/styles.html -->
  <main id="sheet"></main>
  <script type="module" src="/src/dev/stylesSheet.ts"></script>
</body>
</html>
